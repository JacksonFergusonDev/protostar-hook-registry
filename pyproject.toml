[project]
name = "protostar-hook-registry"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0.3", "types-pyyaml>=6.0.12.20260815"]
description = "Automated static JSON registry serving latest pre-commit hook revisions for Protostar scaffolding."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jackson Ferguson", email = "jackson.ferguson0@gmail.com" }]

[dependency-groups]
dev = ["mypy>=2.3.1", "prek>=0.4.14", "ruff>=0.16.4"]

# ==================================================
# Tool Configuration
# ==================================================

# ---- Ruff ---- #

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long - handled automatically by `ruff format`
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---- Mypy ---- #

[tool.mypy]
mypy_path = "src"
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
explicit_package_bases = true
